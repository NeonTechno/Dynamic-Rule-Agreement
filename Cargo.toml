[package]
name = "dynamic-rule-agreement"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Research prototype for dynamic mathematical challenge-response authentication"
readme = "README.md"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
